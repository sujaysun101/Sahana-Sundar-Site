name: Rebuild Sahana Site from original Google Sites capture
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/mirror_google_site.py"
      - ".github/workflows/mirror-google-site.yml"
permissions:
  contents: write
jobs:
  capture-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install capture dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4 pillow
          python -m playwright install --with-deps chromium
      - name: Capture complete published Google Site
        run: python scripts/mirror_google_site.py
      - name: Commit reconstructed pages and locally stored media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ capture-manifest.json
          git add profile/ education/ honors-certifications-awards/ internships/ work-experience/ sports/ high-school-clubs/ music-culture/ references-certificates/ languages/ media-and-public-recognition/ other-milestones/ other-courses-certifications/ gallery/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Rebuild site from 15 original pages and captured media"
            git push
          fi
